<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基础设施损毁智能监测研判平台</title>
<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Echarts -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei","Roboto",sans-serif;}
:root{
  --bg:#0a1628; --panel:#0f1e33; --panel2:#13294a;
  --border:#1e3a5f; --cyan:#00d4ff; --cyan-dim:#0a7ea8;
  --red:#ff4757; --purple:#a855f7; --green:#00e676; --yellow:#ffb74d;
  --text:#cfd8e3; --text-dim:#7a8ba0;
}
body{background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden;}

/* ===== 左侧参数/操作栏 ===== */
.sidebar{width:340px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;overflow-y:auto;box-shadow:2px 0 12px rgba(0,0,0,0.4);}
.brand{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--border);margin-bottom:14px;}
.brand .logo{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--cyan),var(--purple));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:15px;
  box-shadow:0 0 12px rgba(0,212,255,0.5);}
.brand h1{font-size:15px;color:#fff;line-height:1.3;}
.brand p{font-size:10px;color:var(--text-dim);margin-top:2px;}
.group{margin-bottom:16px;}
.group-title{font-size:12px;color:var(--cyan);font-weight:600;margin-bottom:10px;
  padding-left:8px;border-left:3px solid var(--cyan);letter-spacing:1px;}
label{display:block;font-size:11px;color:var(--text-dim);margin:8px 0 4px;}
input[type=text],input[type=number],input[type=date]{width:100%;background:var(--bg);border:1px solid var(--border);
  border-radius:5px;padding:6px 8px;color:var(--text);font-size:12px;}
input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 6px rgba(0,212,255,0.3);}
.latlng-row{display:flex;gap:8px;}
.latlng-col{flex:1;}

/* 模式切换 */
.mode-switch{display:flex;gap:6px;margin-bottom:12px;}
.mode-btn{flex:1;padding:7px;border:1px solid var(--border);background:var(--bg);color:var(--text-dim);
  border-radius:5px;font-size:12px;cursor:pointer;transition:all .15s;}
.mode-btn.active{background:linear-gradient(135deg,var(--cyan-dim),var(--cyan));color:#fff;border-color:var(--cyan);
  box-shadow:0 0 10px rgba(0,212,255,0.4);}

/* 四模块按钮 */
.module-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.mbtn{padding:10px 6px;border:1px solid var(--border);background:var(--panel2);color:var(--text);
  border-radius:6px;font-size:11px;cursor:pointer;text-align:center;transition:all .15s;position:relative;}
.mbtn:hover{border-color:var(--cyan);box-shadow:0 0 8px rgba(0,212,255,0.3);}
.mbtn .ic{font-size:16px;display:block;margin-bottom:3px;}
.mbtn .st{display:block;font-size:9px;color:var(--text-dim);margin-top:2px;}
.mbtn.done{border-color:var(--green);color:var(--green);}
.mbtn.done .st{color:var(--green);}
.mbtn.busy{opacity:0.5;cursor:wait;}

/* 主按钮 */
.btn-run{width:100%;padding:11px;margin-top:8px;border:none;border-radius:6px;cursor:pointer;font-size:13px;
  font-weight:600;background:linear-gradient(135deg,var(--cyan-dim),var(--cyan));color:#fff;
  box-shadow:0 0 12px rgba(0,212,255,0.4);}
.btn-run:hover{box-shadow:0 0 16px rgba(0,212,255,0.6);}
.btn-dl{width:100%;padding:8px;margin-top:6px;border:1px solid var(--border);background:var(--bg);
  color:var(--text);border-radius:5px;cursor:pointer;font-size:11px;}
.btn-dl:hover{border-color:var(--cyan);color:var(--cyan);}

/* 预设区域下拉 */
.preset-wrap{position:relative;margin-bottom:10px;}
.preset-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:7px 8px;
  color:var(--text);font-size:12px;cursor:pointer;}
.preset-dd{position:absolute;top:100%;left:0;right:0;background:var(--panel);border:1px solid var(--border);
  border-radius:5px;z-index:9999;display:none;max-height:200px;overflow-y:auto;}
.preset-dd div{padding:7px 10px;font-size:12px;cursor:pointer;}
.preset-dd div:hover{background:var(--panel2);color:var(--cyan);}

/* ===== 右侧地图主区 ===== */
.main{flex:1;position:relative;overflow:hidden;}
#map{position:absolute;inset:0;background:#050b14;}

/* 悬浮透明面板 */
.overlay{position:absolute;z-index:1000;background:rgba(15,30,51,0.78);backdrop-filter:blur(6px);
  border:1px solid var(--border);border-radius:8px;padding:12px;box-shadow:0 4px 20px rgba(0,0,0,0.5);}
.overlay h4{font-size:12px;color:var(--cyan);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.overlay h4 .fold{cursor:pointer;color:var(--text-dim);font-size:14px;}
.ov-tl{top:14px;left:14px;width:240px;}    /* 模块进度 */
.ov-tr{top:14px;right:14px;width:280px;}   /* 指标/图表 */
.ov-br{bottom:14px;right:14px;width:300px;}/* Echarts */
.ov-body{font-size:11px;max-height:260px;overflow-y:auto;}
.kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(30,58,95,0.4);}
.kv span:first-child{color:var(--text-dim);}
.kv span:last-child{color:var(--cyan);font-weight:600;}
.step-row{display:flex;align-items:center;gap:6px;padding:5px 0;font-size:11px;}
.step-row .dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);}
.step-row.done .dot{background:var(--green);box-shadow:0 0 6px var(--green);}
.step-row.busy .dot{background:var(--yellow);}
.tip{font-size:10px;color:var(--text-dim);margin-top:6px;line-height:1.5;}

/* 顶部模式徽章 */
.badge{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:1000;
  background:rgba(15,30,51,0.85);border:1px solid var(--cyan);border-radius:20px;padding:5px 16px;
  font-size:11px;color:var(--cyan);box-shadow:0 0 10px rgba(0,212,255,0.3);}
</style>
</head>
<body>
<!-- ============ 左侧栏 ============ -->
<div class="sidebar">
  <div class="brand">
    <div class="logo">PW</div>
    <div><h1>基础设施损毁检测业务研判平台</h1>
    <p>  Pixel-Wise T-Test  </p></div>
  </div>

  <!-- 模式切换 -->
  <div class="mode-switch">
    <button class="mode-btn active" data-mode="cloud">云端 GEE</button>
    <button class="mode-btn" data-mode="local">本地离线</button>
  </div>

  <!-- 预设区域 -->
  <div class="preset-wrap" id="preset-wrap">
    <input class="preset-input" id="preset" placeholder="选择预设区域 ▼" readonly>
    <div class="preset-dd" id="preset-dd">
      <div data-w="34.21" data-s="31.21" data-e="34.57" data-n="31.60" data-name="加沙地带" data-war="2023-10-10" data-inf="2024-07-01">加沙地带</div>
      <div data-w="37.45" data-s="47.05" data-e="37.55" data-n="47.15" data-name="马里乌波尔" data-war="2022-02-24" data-inf="2022-05-01">马里乌波尔</div>
      <div data-w="116.20" data-s="39.80" data-e="116.60" data-n="40.10" data-name="北京城区" data-war="2022-01-01" data-inf="2023-01-01">北京城区</div>
    </div>
  </div>

  <form id="form">
    <!-- 云端参数（本地模式隐藏）-->
    <div id="cloud-params">
      <label>经纬度边界</label>
      <div class="latlng-row">
        <div class="latlng-col"><label style="font-size:10px">西经 west</label><input name="west" id="west" value="34.21"></div>
        <div class="latlng-col"><label style="font-size:10px">东经 east</label><input name="east" id="east" value="34.57"></div>
      </div>
      <div class="latlng-row" style="margin-top:6px">
        <div class="latlng-col"><label style="font-size:10px">南纬 south</label><input name="south" id="south" value="31.21"></div>
        <div class="latlng-col"><label style="font-size:10px">北纬 north</label><input name="north" id="north" value="31.60"></div>
      </div>
      <label>时序分界基准日期 split_date</label><input name="war_start" id="war_start" value="2023-10-10" type="date">
      <label>影像筛选截止日期 cutoff_date</label><input name="inference_start" id="inference_start" value="2024-07-01" type="date">
      <label>基准参考时长(月) ref_months</label><input name="pre_interval" id="pre_interval" value="12" type="number">
      <label>变化观测时长(月) obs_months</label><input name="post_interval" id="post_interval" value="1" type="number">
      <label style="display:flex;align-items:center;gap:6px;margin-top:8px;cursor:pointer">
        <input type="checkbox" name="s2_base" style="width:auto"> 灾后 Sentinel-2 实景底图（耗 GEE 配额）</label>
    </div>

    <!-- 本地参数（云端模式隐藏）-->
    <div id="local-params" style="display:none">
      <label>参考基线影像目录</label><input name="pre_dir" value="data/input/pre">
      <label>变化观测影像目录</label><input name="post_dir" value="data/input/post">
      <label>真值标注（可选）</label><input name="ground_truth_path" placeholder="data/input/ground_truth.tif">
    </div>

    <!-- 共用 -->
    <label>损毁阈值 threshold</label><input name="threshold" id="threshold" value="3.3" step="0.1">
  </form>

  <!-- 四模块独立按钮（仅本地模式显示）-->
  <div class="group" id="local-modules" style="display:none">
    <div class="group-title">本地四模块（分步执行）</div>
    <div class="module-btns">
      <button class="mbtn" id="m-preprocess" data-api="/local_preprocess"><span class="ic">①</span>预处理<span class="st">--</span></button>
      <button class="mbtn" id="m-detect" data-api="/local_detect"><span class="ic">②</span>损毁检测<span class="st">--</span></button>
      <button class="mbtn" id="m-analyze" data-api="/local_analyze"><span class="ic">③</span>结果分析<span class="st">--</span></button>
      <button class="mbtn" id="m-visualize" data-api="/local_visualize"><span class="ic">④</span>可视化<span class="st">--</span></button>
    </div>
  </div>

  <!-- 操作 -->
  <div class="group">
    <div class="group-title">操作</div>
    <button class="btn-run" id="run-btn">运行云端检测</button>
    <button class="btn-dl" id="dl-btn">下载结果</button>
  </div>
</div>

<!-- ============ 右侧地图主区 ============ -->
<div class="main">
  <div id="map"></div>
  <div class="badge" id="badge">云端 GEE 模式</div>

  <!-- 悬浮面板：模块进度（左上）-->
  <div class="overlay ov-tl" id="ov-tl" style="display:none">
    <h4>执行进度 <span class="fold" onclick="toggleOv('ov-tl')">—</span></h4>
    <div class="ov-body" id="step-list">
      <div class="step-row"><span class="dot"></span>等待执行</div>
    </div>
  </div>

  <!-- 悬浮面板：损毁研判（业务决策导向）-->
  <div class="overlay ov-tr" id="ov-tr">
    <h4>损毁研判 <span class="fold" onclick="toggleOv('ov-tr')">—</span></h4>
    <div class="ov-body" id="metrics-list">
      <div class="kv"><span>严重等级</span><span id="m-severity" style="font-size:14px;font-weight:700">--</span></div>
      <div class="kv"><span>损毁面积</span><span id="m-area">--</span></div>
      <div class="kv"><span>损毁占比</span><span id="m-ratio">--</span></div>
      <div class="kv"><span>损毁像素</span><span id="m-damage">--</span></div>
      <div class="kv"><span>损毁建筑(估)</span><span id="m-buildings">--</span></div>
      <div class="kv"><span>检测地点</span><span id="m-loc">--</span></div>
      <div class="kv"><span>研判建议</span><span id="m-advice" style="font-size:10px;color:#ffb74d">--</span></div>
    </div>
  </div>

  <!-- 悬浮面板：Echarts 图表（右下）-->
  <div class="overlay ov-br" id="ov-br">
    <h4>损毁占比 <span class="fold" onclick="toggleOv('ov-br')">—</span></h4>
    <div id="chart-ring" style="width:100%;height:200px;"></div>
  </div>
</div>

<script>
const form=document.getElementById('form');
const presetInput=document.getElementById('preset'), presetDd=document.getElementById('preset-dd');
const modeBtns=document.querySelectorAll('.mode-btn');
const cloudParams=document.getElementById('cloud-params'), localParams=document.getElementById('local-params');
const runBtn=document.getElementById('run-btn'), dlBtn=document.getElementById('dl-btn');
const badge=document.getElementById('badge');
let mode='cloud', map=null, resultLayer=null;

/* ===== 地图初始化 ===== */
function initMap(){
  if(map) return;
  map=L.map('map',{zoomControl:true,attributionControl:true}).setView([31.4,34.4],11);
  // 深色底图 CartoDB dark_matter
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
    maxZoom:18, attribution:'© CartoDB dark_matter'
  }).addTo(map);
}
function clearResult(){ if(resultLayer){map.removeLayer(resultLayer);resultLayer=null;} }
let aoiLayer=null;
function drawAoi(bbox){
  if(aoiLayer){map.removeLayer(aoiLayer);aoiLayer=null;}
  const [w,s,e,n]=bbox;
  aoiLayer=L.rectangle([[s,w],[n,e]],{color:'#00d4ff',weight:2,fill:false,dashArray:'6 4'}).addTo(map);
  map.fitBounds([[s,w],[n,e]]);
}
function showImgOnMap(url,bbox){
  clearResult();
  const [w,s,e,n]=bbox;
  resultLayer=L.imageOverlay(url,[[s,w],[n,e]],{opacity:0.85}).addTo(map);
  drawAoi(bbox);
}
initMap();

/* ===== 悬浮面板折叠 ===== */
function toggleOv(id){
  const el=document.getElementById(id);
  const body=el.querySelector('.ov-body,#chart-ring');
  if(body) body.style.display=(body.style.display==='none'?'':'none');
}

/* ===== Echarts 环形（损毁占比）===== */
const ringChart=echarts.init(document.getElementById('chart-ring'));
function renderRing(damaged,total){
  const valid=total-damaged;
  ringChart.setOption({
    series:[{
      type:'pie',radius:['52%','72%'],center:['50%','50%'],
      data:[
        {value:damaged,name:'损毁',itemStyle:{color:'#ff4757'}},
        {value:valid>0?valid:0.001,name:'未损',itemStyle:{color:'#1e3a5f'}}
      ],
      label:{color:'#cfd8e3',fontSize:10},labelLine:{lineStyle:{color:'#7a8ba0'}}
    }],
    tooltip:{trigger:'item',textStyle:{color:'#fff'},backgroundColor:'#0f1e33',borderColor:'#1e3a5f'}
  });
}
renderRing(0,1);

/* ===== 预设区域 ===== */
presetInput.onclick=()=>presetDd.style.display='block';
document.addEventListener('click',e=>{ if(!presetInput.contains(e.target)&&!presetDd.contains(e.target)) presetDd.style.display='none'; });
presetDd.querySelectorAll('div').forEach(it=>{
  it.onclick=()=>{
    document.getElementById('west').value=it.dataset.w;
    document.getElementById('south').value=it.dataset.s;
    document.getElementById('east').value=it.dataset.e;
    document.getElementById('north').value=it.dataset.n;
    document.getElementById('war_start').value=it.dataset.war;
    document.getElementById('inference_start').value=it.dataset.inf;
    presetInput.value=it.dataset.name;
    presetDd.style.display='none';
    // 地图画出监测范围矩形 + 定位
    drawAoi([+it.dataset.w,+it.dataset.s,+it.dataset.e,+it.dataset.n]);
    setMetrics({}, it.dataset.name);   // 更新监测地点
  };
});

/* ===== 模式切换 ===== */
modeBtns.forEach(b=>b.onclick=()=>{
  mode=b.dataset.mode;
  modeBtns.forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  cloudParams.style.display=(mode==='cloud'?'':'none');
  localParams.style.display=(mode==='local'?'':'none');
  badge.textContent=(mode==='cloud'?'云端 GEE 模式':'本地离线模式');
  runBtn.textContent=(mode==='cloud'?'运行云端检测':'运行本地检测（一键）');
  document.getElementById('ov-tl').style.display=(mode==='local'?'':'none'); // 模块进度仅本地
  document.getElementById('local-modules').style.display=(mode==='local'?'':'none'); // 四模块按钮仅本地
  document.getElementById('preset-wrap').style.display=(mode==='cloud'?'':'none'); // 预设区域仅云端
});

/* ===== 业务研判指标（决策导向：严重等级/面积/地点/建议）===== */
let currentRegion='监测区域';
const stepDefs=[['preprocess','① 预处理'],['detect','② 损毁检测'],['analyze','③ 结果分析'],['visualize','④ 可视化']];
function renderStepList(states){
  document.getElementById('step-list').innerHTML=stepDefs.map(([k,label])=>{
    const st=states?.[k]||'wait';
    const cls=st==='done'?'done':st==='busy'?'busy':'';
    const mark=st==='done'?'✓':st==='busy'?'运行中…':'等待';
    return `<div class="step-row ${cls}"><span class="dot"></span>${label} ${mark}</div>`;
  }).join('');
}
function setMetrics(meta, regionName, bounds){
  const st=(meta?.statistics)||meta?.metadata?.statistics||{};
  const dmg=st.damage_pixels ?? meta?.damage_pixels ?? 0;
  const tot=st.total_pixels ?? meta?.total_pixels ?? 0;
  const ratio=st.damage_ratio ?? meta?.damage_ratio ?? 0;
  if(regionName) currentRegion=regionName;
  // 严重等级（按损毁占比业务分级，供领导决策）
  const sev=ratio>0.5?{t:'特重',c:'#ff4757'}:ratio>0.2?{t:'严重',c:'#ff7043'}:ratio>0.05?{t:'中等',c:'#ffb74d'}:{t:'轻微',c:'#00e676'};
  const sevEl=document.getElementById('m-severity'); sevEl.textContent=sev.t; sevEl.style.color=sev.c;
  document.getElementById('m-area').textContent=dmg>0?(dmg*0.0004).toFixed(3)+' km²':'--';
  document.getElementById('m-ratio').textContent=(ratio*100).toFixed(2)+'%';
  document.getElementById('m-damage').textContent=dmg||'--';
  const bld=dmg>0?Math.round(dmg*400/150):0;
  document.getElementById('m-buildings').textContent=bld>0?bld+' 栋':'--';
  // 检测地点 + 经纬度（bounds 中心）
  let loc=currentRegion;
  if(bounds){const[w,s,e,n]=bounds;loc+=` (${(((+w)+(+e))/2).toFixed(3)}°E, ${(((+s)+(+n))/2).toFixed(3)}°N)`;}
  document.getElementById('m-loc').textContent=loc;
  document.getElementById('m-advice').textContent=ratio>0.5?'大面积损毁，重建最高优先级，建议专项救灾':
    ratio>0.2?'集中损毁，重建重点区，优先救援':ratio>0.05?'局部损毁，关注重点建筑':'少量变化，常规监测';
  if(tot>0) renderRing(dmg,tot);
}
renderStepList({});

/* ===== 一键运行 ===== */
runBtn.onclick=async()=>{
  const fd=new FormData(form);
  if(mode==='cloud'){
    const res=await fetch('/run_pwtt',{method:'POST',body:fd});
    const d=await res.json();
    if(d.error){alert('云端: '+d.error);return;}
    setMetrics(d);
    if(d.tile_url&&window.L){ // 损毁瓦片叠加
      clearResult();
      const[w,s,e,n]=[+fd.get('west'),+fd.get('south'),+fd.get('east'),+fd.get('north')];
      if(d.base_tile_url) L.tileLayer(d.base_tile_url,{maxZoom:18}).addTo(map);
      resultLayer=L.tileLayer(d.tile_url,{opacity:0.65}).addTo(map);
      drawAoi([w,s,e,n]);
    }
  }else{
    // 本地一键（四步）
    renderStepList({preprocess:'busy',detect:'busy',analyze:'busy',visualize:'busy'});
    const res=await fetch('/run_pwtt_local',{method:'POST',body:fd});
    const d=await res.json();
    if(d.error){alert('本地: '+d.error);return;}
    setMetrics(d.metadata||d, presetInput.value||'监测区域');
    renderStepList({preprocess:'done',detect:'done',analyze:'done',visualize:'done'});
    if(d.img_url){
      const viz=await fetch('/local_visualize',{method:'POST',body:fd});
      const dv=await viz.json();
      if(dv.img_url && dv.bounds) showImgOnMap('/static/'+dv.img_url, dv.bounds);
    }
  }
};

/* ===== 四模块独立按钮（本地分步）===== */
const modKey={'m-preprocess':'preprocess','m-detect':'detect','m-analyze':'analyze','m-visualize':'visualize'};
const modStates={};
['m-preprocess','m-detect','m-analyze','m-visualize'].forEach(id=>{
  const btn=document.getElementById(id);
  btn.onclick=async()=>{
    btn.classList.add('busy'); btn.querySelector('.st').textContent='运行中';
    modStates[modKey[id]]='busy'; renderStepList(modStates);
    const fd=new FormData(form);
    const res=await fetch(btn.dataset.api,{method:'POST',body:fd});
    const d=await res.json();
    btn.classList.remove('busy');
    if(d.error){btn.querySelector('.st').textContent='失败'; modStates[modKey[id]]='fail'; renderStepList(modStates); alert(id+': '+d.error);return;}
    btn.classList.add('done'); modStates[modKey[id]]='done'; renderStepList(modStates);
    if(id==='m-preprocess') btn.querySelector('.st').textContent=d.msg||'完成';
    if(id==='m-detect'){ btn.querySelector('.st').textContent='完成'; setMetrics(d.metadata, presetInput.value, d.bounds); if(d.img_url && d.bounds) showImgOnMap('/static/'+d.img_url, d.bounds); }
    if(id==='m-analyze'){ btn.querySelector('.st').textContent=d.msg||'完成'; if(d.metrics) setMetrics(d.metrics, presetInput.value); }
    if(id==='m-visualize'){ btn.querySelector('.st').textContent='完成'; if(d.img_url && d.bounds) showImgOnMap('/static/'+d.img_url, d.bounds); }
  };
});
